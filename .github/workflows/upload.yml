
name: YouTube Music Automation

on:
  workflow_dispatch:

  schedule:
    # 12:30 PM IST
    - cron: "0 7 * * *"

    # 7:00 PM IST
    - cron: "30 13 * * *"

permissions:
  contents: write

concurrency:
  group: youtube-music-automation
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      # 1. CHECKOUT REPOSITORY
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # 2. SETUP PYTHON WITH CACHE
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # 3. INSTALL DEPENDENCIES
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --prefer-binary -r requirements.txt

      # 4. CHECK REQUIRED SECRETS
      - name: Check required secrets
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import sys

          required = [
              "YOUTUBE_TOKEN_JSON",
              "DRIVE_FOLDER_ID",
          ]

          missing = [
              key for key in required
              if not os.getenv(key)
          ]

          if missing:
              print("Missing GitHub Actions secrets:")
              for key in missing:
                  print(f"- {key}")
              sys.exit(1)

          try:
              json.loads(os.environ["YOUTUBE_TOKEN_JSON"])
          except json.JSONDecodeError:
              print("Invalid YOUTUBE_TOKEN_JSON.")
              sys.exit(1)

          print("All required secrets are available.")
          PY

      # 5. RUN YOUTUBE AUTOMATION
      - name: Run YouTube automation
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}

          DAILY_UPLOAD_LIMIT: "1"
          YOUTUBE_PRIVACY: "public"
          YOUTUBE_CATEGORY_ID: "10"
          TIMEZONE: "Asia/Kolkata"

        run: |
          python -m src.main

      # 6. SAVE HISTORY WITH AUTOMATIC RETRIES
      - name: Save automation history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p data

          git add -A data/

          if git diff --cached --quiet; then
            echo "No history changes to save."
            exit 0
          fi

          git commit -m "Update YouTube automation history"

          for attempt in 1 2 3 4 5; do

            echo "Push attempt $attempt of 5"

            # Fetch latest remote changes
            git fetch origin main

            # Rebase local commit onto latest main
            if ! git rebase origin/main; then
              echo "Rebase failed. Aborting."
              git rebase --abort || true
              exit 1
            fi

            # Push updated history
            if git push origin HEAD:main; then
              echo "History pushed successfully."
              exit 0
            fi

            echo "Push failed."

            if [ "$attempt" -lt 5 ]; then
              echo "Retrying in 15 seconds..."
              sleep 15
            fi

          done

          echo "ERROR: History push failed after 5 attempts."
          exit 1
