```yaml
name: YouTube Music Automation

on:
  workflow_dispatch:

  schedule:
    # 12:30 PM IST
    - cron: "0 7 * * *"

    # 7:00 PM IST
    - cron: "30 13 * * *"

permissions:
  contents: write

concurrency:
  group: youtube-shorts-automation
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # 1. CHECKOUT
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # 2. PYTHON SETUP
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 3. INSTALL DEPENDENCIES
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 4. CHECK REQUIRED SECRETS
      - name: Check required secrets
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import sys

          required = [
              "YOUTUBE_TOKEN_JSON",
              "DRIVE_FOLDER_ID",
          ]

          missing = [
              key for key in required
              if not os.getenv(key)
          ]

          if missing:
              print("Missing GitHub Actions secrets:")
              for key in missing:
                  print(f"- {key}")
              sys.exit(1)

          try:
              json.loads(os.environ["YOUTUBE_TOKEN_JSON"])
          except json.JSONDecodeError:
              print("Invalid YOUTUBE_TOKEN_JSON.")
              sys.exit(1)

          print("All required secrets are available.")
          PY

      # 5. RUN AUTOMATION
      - name: Run YouTube automation
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}

          DAILY_UPLOAD_LIMIT: "1"
          YOUTUBE_PRIVACY: "public"
          YOUTUBE_CATEGORY_ID: "10"
          TIMEZONE: "Asia/Kolkata"

        run: |
          python -m src.main

      # 6. SAVE HISTORY
      - name: Save automation history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p data
          git add -A data/

          if git diff --cached --quiet; then
            echo "No history changes to save."
          else
            git commit -m "Update YouTube automation history"
            git push
          fi
```
