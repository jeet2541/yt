
name: LYVEXE Video Pairs Automation

on:
  workflow_dispatch:

  schedule:
    # Daily check at 7 PM IST (13:30 UTC).
    # Python state decides whether today is an upload day.
    - cron: "30 13 * * *"

permissions:
  contents: read

concurrency:
  group: lyvexe-pairs-automation
  cancel-in-progress: false

jobs:
  process-video-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r lyvexe_pairs/requirements.txt

      - name: Run LYVEXE automation
        env:
          LYVEXE_PAIRS_TOKEN_JSON: ${{ secrets.LYVEXE_PAIRS_TOKEN_JSON }}
          LYVEXE_VIDEOS_FOLDER_ID: ${{ secrets.LYVEXE_VIDEOS_FOLDER_ID }}
          LYVEXE_SONGS_FOLDER_ID: ${{ secrets.LYVEXE_SONGS_FOLDER_ID }}
          LYVEXE_GENERATED_FOLDER_ID: ${{ secrets.LYVEXE_GENERATED_FOLDER_ID }}
        run: |
          python lyvexe_pairs/main.py
